# PC-Steuerung / ESP32 ESP-WROOM-32
# Neutraler Hostname; keine persoenlichen Namen oder Zugangsdaten.
# ACHTUNG: Hardware, Signalpegel und GPIO2-LED vor Betrieb pruefen.
# Statussignale setzen gepruefte, 3,3-V-kompatible PC817-Ausgaenge voraus.
# Der lange Power-Befehl ist KEIN sicherheitstechnischer Not-Aus.

esphome:
  name: pc-steuerung
  friendly_name: PC Steuerung
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: wlan
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "PC-Steuerung-Fallback"
    password: !secret pc_fallback_password

captive_portal:

# Interne ESPHome-Wartungsoberflaeche: durchgehend passwortgeschuetzt.
# Die geplante Caddy-Seite https://pc.home.arpa/ (mit /login, /steuerung)
# laeuft NICHT auf dem ESP32, sondern in einem separaten Portal-Backend.
# Nur Home Assistant darf intern per verschluesselter ESPHome-API
# die Schalt- und Number-Entitaeten bedienen. Caddy darf NICHT den
# nativen ESPHome-Webserver/REST-Endpunkt direkt weiterreichen.
# Keine Router-Portfreigabe, kein Abschalten von web_server.auth.
web_server:
  port: 80
  version: 3
  local: true
  include_internal: false
  ota: false
  auth:
    type: digest
    username: !secret pc_web_username
    password: !secret pc_web_password

globals:
  - id: led_ticks
    type: int
    restore_value: no
    initial_value: '0'
  - id: wlan_ticks
    type: int
    restore_value: no
    initial_value: '0'
  - id: notaus_ticks
    type: int
    restore_value: no
    initial_value: '0'
  - id: notaus_aktiv
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: power_puls_ticks
    type: int
    restore_value: no
    initial_value: '0'
  # Sechs Sekunden gefahrloser LED-Test, kein Relaisimpuls.
  - id: notaus_led_test_ticks
    type: int
    restore_value: no
    initial_value: '0'
  # Relaisschutz: niemals zwei gleichzeitig laufende Kontaktbefehle.
  - id: pc_relais_belegt
    type: bool
    restore_value: no
    initial_value: 'false'
  # Boot und jeder Kontaktabfall starten eine neue Schaltsperre.
  - id: pc_relais_zuletzt_off_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Dauer der Sperre wird beim Loslassen des Relais festgelegt.
  - id: pc_relais_sperre_ms
    type: uint32_t
    restore_value: no
    initial_value: '2000'

# Relais muss 3,3-V-HIGH-Steuerung verifiziert unterstuetzen.
switch:
  - platform: gpio
    id: pc_relais
    internal: true
    pin:
      number: GPIO23
      inverted: false
    restore_mode: ALWAYS_OFF

# GPIO2-LED ist boardabhaengig; feste PWR-LED wird NICHT gesteuert.
output:
  - platform: ledc
    id: pc_status_led
    pin:
      number: GPIO2
      inverted: false
    frequency: 1220Hz

select:
  - platform: template
    name: "Onboard LED Modus"
    id: led_modus
    icon: mdi:led-on
    optimistic: true
    restore_value: true
    initial_option: "AUS"
    options:
      - "Aus Blinkend"
      - "Ein Blinkend"
      - "Aus Langsam blinken"
      - "Ein Langsam blinken"
      - "Aus Leuchtend"
      - "Ein Leuchtend"
      - "AUS"
    on_value:
      then:
        - lambda: |-
            id(led_ticks) = 0;

# In Home Assistant UND Weboberflaeche aenderbar; Neustartfest.
number:
  - platform: template
    name: "PC Ein/Aus Impulsdauer"
    id: pc_power_dauer
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0.5
    min_value: 0.2
    max_value: 1.5
    step: 0.1

  - platform: template
    name: "PC Not-Aus Impulsdauer"
    id: pc_notaus_dauer
    icon: mdi:timer-alert-outline
    unit_of_measurement: "s"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 4
    max_value: 12
    step: 0.5

  - platform: template
    name: "PC Relais Schaltsperre"
    id: pc_relais_sperrzeit
    icon: mdi:shield-lock-outline
    unit_of_measurement: "s"
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 2
    min_value: 0.5
    max_value: 10
    step: 0.5

# Relaisdauer: normal 0,2-1,5s / Not-Aus 4-12s.
# Die Zeit wird beim Start des jeweiligen Befehls einmalig gelesen.
# Der reine LED-Test dauert weiterhin 6 Sekunden.
script:
  - id: pc_power_impuls
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !id(notaus_aktiv) &&
                     !id(pc_notaus_impuls).is_running() &&
                     !id(pc_relais_belegt) &&
                     (uint32_t)(millis() - id(pc_relais_zuletzt_off_ms)) >=
                         id(pc_relais_sperre_ms);
          then:
            - lambda: |-
                id(pc_relais_belegt) = true;
                id(power_puls_ticks) = 100;
                id(led_ticks) = 0;
            - switch.turn_on: pc_relais
            # Lambda liefert Millisekunden, Fallback 500ms.
            - delay: !lambda |-
                const float sekunden = id(pc_power_dauer).state;
                if (!(sekunden >= 0.2f && sekunden <= 1.5f)) {
                  return (uint32_t) 500;
                }
                return (uint32_t) (sekunden * 1000.0f + 0.5f);
            - switch.turn_off: pc_relais
            - lambda: |-
                id(pc_relais_zuletzt_off_ms) = millis();
                const float sekunden = id(pc_relais_sperrzeit).state;
                id(pc_relais_sperre_ms) =
                    (sekunden >= 0.5f && sekunden <= 10.0f)
                    ? (uint32_t)(sekunden * 1000.0f + 0.5f)
                    : (uint32_t)2000;
                id(pc_relais_belegt) = false;
          else:
            - logger.log:
                level: WARN
                format: "Power abgelehnt: Relais belegt oder Schaltsperre aktiv"

  - id: pc_notaus_impuls
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              // OR-Freigabe: Haupt-12V ODER mindestens 2s
              // durchgehend leuchtende Mainboard-Power-LED.
              // PLED-Blinken im Standby soll NICHT sofort freigeben.
              const bool strom_ein =
                  id(pc_12v_status).has_state() &&
                  id(pc_12v_status).state;
              const bool power_led_stabil =
                  id(pc_power_led_stabil).has_state() &&
                  id(pc_power_led_stabil).state;
              return !id(notaus_aktiv) &&
                     !id(pc_power_impuls).is_running() &&
                     !id(pc_relais_belegt) &&
                     (uint32_t)(millis() - id(pc_relais_zuletzt_off_ms)) >=
                         id(pc_relais_sperre_ms) &&
                     (strom_ein || power_led_stabil);
          then:
            - lambda: |-
                id(pc_relais_belegt) = true;
                id(notaus_aktiv) = true;
                id(notaus_ticks) = 0;
                id(notaus_led_test_ticks) = 0;
                id(power_puls_ticks) = 0;
                // Zeigt sofort an, dass die Freigabe erfolgreich war.
                id(pc_status_led).set_level(1.0f);
                id(pc_notaus_status).publish_state(true);
            - text_sensor.template.publish:
                id: pc_notaus_rueckmeldung
                state: "Gestartet: Power-Kontakt gehalten (4-12s)"
            - logger.log:
                level: WARN
                format: "Erzwungenes Ausschalten gestartet"
            - switch.turn_on: pc_relais
            # Lambda liefert Millisekunden, Fallback 10s.
            - delay: !lambda |-
                const float sekunden = id(pc_notaus_dauer).state;
                if (!(sekunden >= 4.0f && sekunden <= 12.0f)) {
                  return (uint32_t) 10000;
                }
                return (uint32_t) (sekunden * 1000.0f + 0.5f);
            # Danach den potentialfreien Kontakt immer oeffnen.
            - switch.turn_off: pc_relais
            - lambda: |-
                id(pc_relais_zuletzt_off_ms) = millis();
                const float sekunden = id(pc_relais_sperrzeit).state;
                id(pc_relais_sperre_ms) =
                    (sekunden >= 0.5f && sekunden <= 10.0f)
                    ? (uint32_t)(sekunden * 1000.0f + 0.5f)
                    : (uint32_t)2000;
                id(pc_relais_belegt) = false;
            - text_sensor.template.publish:
                id: pc_notaus_rueckmeldung
                state: "Impuls beendet: pruefe 12V und Power-LED"
            - if:
                condition:
                  lambda: |-
                    // Nur beenden, wenn BEIDE Quellen
                    // mindestens 3s lang AUS melden.
                    return id(pc_betrieb_erkannt).has_state() &&
                           !id(pc_betrieb_erkannt).state;
                then:
                  - lambda: |-
                      id(notaus_aktiv) = false;
                      id(notaus_ticks) = 0;
                      id(led_ticks) = 0;
                      id(pc_notaus_status).publish_state(false);
                  - text_sensor.template.publish:
                      id: pc_notaus_rueckmeldung
                      state: "Abgeschlossen: beide PC-Signale AUS"
          else:
            - if:
                condition:
                  lambda: |-
                    return id(pc_relais_belegt) ||
                           id(pc_power_impuls).is_running() ||
                           id(notaus_aktiv) ||
                           (uint32_t)(millis() - id(pc_relais_zuletzt_off_ms)) <
                               id(pc_relais_sperre_ms);
                then:
                  - logger.log:
                      level: WARN
                      format: "Not-Aus abgelehnt: Relais belegt oder Schaltsperre"
                  - text_sensor.template.publish:
                      id: pc_notaus_rueckmeldung
                      state: "Abgelehnt: Relais belegt oder Schaltsperre aktiv"
                else:
                  - logger.log:
                      level: WARN
                      format: "Not-Aus abgelehnt: weder 12V noch stabile PLED EIN"
                  - text_sensor.template.publish:
                      id: pc_notaus_rueckmeldung
                      state: "Abgelehnt: 12V AUS und Power-LED nicht stabil EIN"

button:
  - platform: template
    name: "PC Ein/Aus"
    id: pc_power_button
    icon: mdi:power
    on_press:
      - script.execute: pc_power_impuls
  - platform: template
    name: "PC Not-Aus (Ausschalten erzwingen)"
    id: pc_notaus_button
    icon: mdi:alert-octagon
    on_press:
      - script.execute: pc_notaus_impuls
  # Testet das Warnblinken sechs Sekunden lang OHNE Relais.
  # Damit laesst sich GPIO2 unabhaengig vom 12-V-Sensor pruefen.
  - platform: template
    name: "Not-Aus LED Test (ohne Relais)"
    id: pc_notaus_led_test_button
    icon: mdi:led-on
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: 'return !id(notaus_aktiv);'
          then:
            - lambda: |-
                id(notaus_led_test_ticks) = 60;
                id(notaus_ticks) = 0;
                id(pc_status_led).set_level(1.0f);
            - text_sensor.template.publish:
                id: pc_notaus_rueckmeldung
                state: "LED-Test gestartet (ohne Relaisaktion)"

  - platform: restart
    name: "ESP32 Neustart"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "ESP32 Online"
    id: esp32_online
    entity_category: diagnostic

  - platform: template
    name: "Ausschalten erzwingen aktiv"
    id: pc_notaus_status
    icon: mdi:alert-octagon
    lambda: |-
      return id(notaus_aktiv);

  # Read-only Status fuer den Portal-Statusadapter in Home Assistant.
  # Beide Werte sind Beobachtungen, keine freigegebenen Schreib-Endpunkte.
  - platform: template
    name: "PC Relais aktiv"
    id: pc_relais_aktiv
    icon: mdi:electric-switch
    lambda: |-
      return id(pc_relais_belegt);

  - platform: template
    name: "PC Schaltsperre aktiv"
    id: pc_schaltsperre_aktiv
    icon: mdi:shield-lock
    lambda: |-
      return (uint32_t)(millis() - id(pc_relais_zuletzt_off_ms)) <
             id(pc_relais_sperre_ms);

  # Potentialfreier Schliesser zwischen GPIO18 und GND.
  - platform: gpio
    id: pc_manueller_taster
    internal: true
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: pc_power_impuls

  # Kanal 1: nur 0 bis 3,3 V am GPIO; aktiv-LOW angenommen.
  - platform: gpio
    name: "PC 12V Versorgung"
    id: pc_12v_status
    device_class: power
    pin:
      number: GPIO22
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 500ms
      - delayed_off: 2s

  # Kanal 2: LED-Eingang am Mainboard NICHT direkt anschliessen,
  # bevor Mindest-Eingangsspannung des PC817-Moduls geprueft ist!
  - platform: gpio
    name: "PC Power LED"
    id: pc_power_led
    icon: mdi:led-on
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

  # Blinkende PLED im Standby ist KEINE sichere PC-EIN-Meldung.
  # Fuer Not-Aus darf die PLED erst nach 2s Dauerlicht zaehlen.
  - platform: template
    name: "PC Power LED stabil"
    id: pc_power_led_stabil
    entity_category: diagnostic
    lambda: |-
      if (!id(pc_power_led).has_state()) return {};
      return id(pc_power_led).state;
    filters:
      - delayed_on: 2s
      - delayed_off: 250ms

  # Zusammengefuehrter Betriebsstatus fuer LED-Modi und Abschaltkontrolle.
  # 3s Nachlauf verhindert ein sofortiges Ende bei kurzen LED-Pausen.
  - platform: template
    name: "PC Betrieb erkannt"
    id: pc_betrieb_erkannt
    icon: mdi:desktop-tower-monitor
    lambda: |-
      const bool strom_ein =
          id(pc_12v_status).has_state() &&
          id(pc_12v_status).state;
      const bool led_stabil =
          id(pc_power_led_stabil).has_state() &&
          id(pc_power_led_stabil).state;
      return strom_ein || led_stabil;
    filters:
      - delayed_off: 3s
    on_release:
      then:
        - if:
            condition:
              lambda: |-
                return id(notaus_aktiv) &&
                       !id(pc_notaus_impuls).is_running();
            then:
              - lambda: |-
                  id(notaus_aktiv) = false;
                  id(notaus_ticks) = 0;
                  id(led_ticks) = 0;
                  id(pc_notaus_status).publish_state(false);
              - text_sensor.template.publish:
                  id: pc_notaus_rueckmeldung
                  state: "Abgeschlossen: beide PC-Signale AUS"

# Alle Muster ueber 100-ms-Takt, nur GPIO2, niemals PWR-LED.
# Prioritaet: Not-Aus > WLAN-Ausfall > Power-Puls > LED-Modus
interval:
  - interval: 100ms
    then:
      - lambda: |-
          float helligkeit = 0.0f;
          const int puls_rest = id(power_puls_ticks);
          if (id(power_puls_ticks) > 0) id(power_puls_ticks)--;

          if (id(notaus_aktiv) || id(notaus_led_test_ticks) > 0) {
            // Not-Aus und separater LED-Test: 0,5 s EIN / 0,5 s AUS.
            // Beide uebersteuern WLAN und alle normalen LED-Modi.
            const int t = id(notaus_ticks);
            helligkeit = (t < 5) ? 1.0f : 0.0f;
            id(notaus_ticks) = (t + 1) % 10;
            if (id(notaus_led_test_ticks) > 0) {
              id(notaus_led_test_ticks)--;
              if (id(notaus_led_test_ticks) == 0 &&
                  !id(notaus_aktiv)) {
                id(pc_notaus_rueckmeldung).publish_state(
                    "LED-Test beendet");
              }
            }
            id(wlan_ticks) = 0;
            id(led_ticks) = 0;

          } else if (!id(wlan).is_connected()) {
            // WLAN-Verlust: 300 ms EIN, 300 ms AUS
            const int t = id(wlan_ticks);
            helligkeit = (t < 3) ? 1.0f : 0.0f;
            id(wlan_ticks) = (t + 1) % 6;
            id(notaus_ticks) = 0;
            id(led_ticks) = 0;

          } else if (puls_rest > 0) {
            // 10 Sekunden: 5 weiche PWM-Pulse je 2 Sekunden
            const int t = (100 - puls_rest) % 20;
            const float winkel = 6.2831853f * t / 20.0f;
            helligkeit = 0.08f +
                         0.92f * (1.0f - cosf(winkel)) / 2.0f;
            id(led_ticks) = 0;
            id(wlan_ticks) = 0;
            id(notaus_ticks) = 0;

          } else {
            id(wlan_ticks) = 0;
            id(notaus_ticks) = 0;
            if (id(led_modus).has_state() &&
                id(pc_betrieb_erkannt).has_state()) {
              const bool pc_ein = id(pc_betrieb_erkannt).state;
              const auto modus = id(led_modus).current_option();
              const int t = id(led_ticks);

              if (modus == "Aus Blinkend") {
                if (!pc_ein && (t % 20 < 10)) helligkeit = 1.0f;
              } else if (modus == "Ein Blinkend") {
                if (pc_ein && (t % 20 < 10)) helligkeit = 1.0f;
              } else if (modus == "Aus Langsam blinken") {
                if (!pc_ein && (t % 55 < 5)) helligkeit = 1.0f;
              } else if (modus == "Ein Langsam blinken") {
                if (pc_ein && (t % 55 < 5)) helligkeit = 1.0f;
              } else if (modus == "Aus Leuchtend") {
                if (!pc_ein) helligkeit = 1.0f;
              } else if (modus == "Ein Leuchtend") {
                if (pc_ein) helligkeit = 1.0f;
              }
              // AUS: 0% Helligkeit
            }
            // 220 ist durch 20 und 55 teilbar.
            id(led_ticks) = (id(led_ticks) + 1) % 220;
          }

          id(pc_status_led).set_level(helligkeit);

# Klare Rueckmeldung, ob das erzwungene Ausschalten angenommen wurde.
text_sensor:
  - platform: template
    name: "Ausschalten Rueckmeldung"
    id: pc_notaus_rueckmeldung
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: never

  # Kompakter, lesbarer PC-Status fuer die lokale Status-Webseite.
  # UNBEKANNT waehrend Start/nicht initialisierter kombinierter Sensor.
  # Ob die beiden PC817-Eingaenge elektrisch funktionieren, MUSS
  # vorher am realen Rechner geprueft werden.
  - platform: template
    name: "PC Zustand"
    id: pc_zustand_portal
    icon: mdi:desktop-tower-monitor
    update_interval: 2s
    lambda: |-
      if (!id(pc_betrieb_erkannt).has_state()) return {"UNBEKANNT"};
      if (id(pc_betrieb_erkannt).state) return {"EIN"};
      return {"AUS"};

  # Der Login-Backend-Status ist hiervon unabhaengig: Dieser Sensor
  # informiert nur darueber, ob ein Relaisbefehl momentan blockiert waere.
  - platform: template
    name: "PC Steuerung Status"
    id: pc_steuerung_status
    icon: mdi:shield-check
    update_interval: 1s
    lambda: |-
      if (id(pc_relais_belegt)) return {"Relais aktiv"};
      if (id(notaus_aktiv)) return {"Ausschaltkontrolle aktiv"};
      if ((uint32_t)(millis() - id(pc_relais_zuletzt_off_ms)) <
          id(pc_relais_sperre_ms)) return {"Schaltsperre aktiv"};
      return {"Bereit"};

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    id: wifi_rssi
    update_interval: 30s
    entity_category: diagnostic
  - platform: uptime
    name: "ESP32 Laufzeit"
    id: pc_controller_uptime
    update_interval: 30s
    entity_category: diagnostic

  # Verbleibende lokale Relaissperre fuer Portal und HA (Sekunden).
  # Ein Wert 0 ist nur eine Statusinformation, kein Authentifizierungsrecht.
  - platform: template
    name: "PC Schaltsperre Restzeit"
    id: pc_schaltsperre_restzeit
    icon: mdi:timer-sand
    unit_of_measurement: "s"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const uint32_t vergangen = (uint32_t)(
          millis() - id(pc_relais_zuletzt_off_ms));
      const uint32_t sperre = id(pc_relais_sperre_ms);
      if (vergangen >= sperre) return 0.0f;
      return (sperre - vergangen) / 1000.0f;
