name: Factorio - PowerShell und Modliste pruefen
on:
  push:
    paths:
      - "Factorio/**"
      - ".github/workflows/factorio-check.yml"
  pull_request:
    paths:
      - "Factorio/**"
      - ".github/workflows/factorio-check.yml"
  workflow_dispatch:

jobs:
  amp-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse AMP official-portal sync and verify no ZIP modifications
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Factorio/BBQ-AMP-Portal-Sync.py
          grep -q "sha1_file(staged_zip)" Factorio/BBQ-AMP-Portal-Sync.py || { echo 'Checksum verification missing'; exit 1; }
          grep -q "os.replace(old_mods, backup)" Factorio/BBQ-AMP-Portal-Sync.py || { echo 'AMP backup missing'; exit 1; }
          grep -q "os.replace(stage, old_mods)" Factorio/BBQ-AMP-Portal-Sync.py || { echo 'Atomic swap missing'; exit 1; }
          if grep -Eq "ZipArchive|data-updates[.]lua|BBQ-Angels-Client-Patch" Factorio/BBQ-AMP-Portal-Sync.py; then
            echo 'Unexpected custom ZIP patching reference'
            exit 1
          fi

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell and validate mod pack
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'Factorio'
          $files = @((Join-Path $root 'BBQ-GitHub-Launcher.ps1'), (Join-Path $root 'BBQ-GitHub-Launcher-v2.ps1'))
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw "PowerShell syntax error: $file" }
          }
          $list = Get-Content (Join-Path $root 'mod-list.json') -Raw | ConvertFrom-Json
          $pins = Get-Content (Join-Path $root 'version-pins.json') -Raw | ConvertFrom-Json
          $all = @($list.mods)
          if ($all.Count -lt 4) { throw 'Invalid mod count' }
          $ids = @{}
          foreach ($entry in $all) {
            if (-not $entry.name -or $entry.enabled -isnot [bool]) { throw 'Invalid mod entry' }
            if ($ids.ContainsKey($entry.name)) { throw "Duplicate mod: $($entry.name)" }
            $ids[$entry.name] = $entry.enabled
          }
          if (-not $ids['base']) { throw 'base must be enabled' }
          if ($ids['saplib'] -and $ids['cargo-ships']) { throw 'saplib conflicts with cargo-ships resource autoplace in this pack' }
          if ($ids['angelsaddons-space-age']) { throw 'Broken Angel Space Age original must remain disabled' }
          if ($ids['angelsaddons-space-age-revived']) { throw 'Revived fork 0.0.14 has obsolete Bob turbo-belt names' }
          if ($ids['TurboBelt'] -and $ids['space-age']) { throw 'TurboBelt conflicts with Space Age' }
          if ($ids['angels-space-age-tungsten-compat']) { throw 'Tungsten patch requires disabled Angel original' }
          if ($pins.PSObject.Properties.Name -contains 'angelsaddons-space-age-revived') { throw 'Inactive Revived fork must not have a version pin' }
          foreach ($p in $pins.PSObject.Properties) {
            if (-not $ids[$p.Name]) { throw "Pinned mod not enabled: $($p.Name)" }
            if ($p.Value -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw "Invalid pin: $($p.Name)" }
          }
          $encoded = [IO.File]::ReadAllText((Join-Path $root 'BBQ-ModDownloader-core.ps1.gz.b64')).Trim()
          $compressed = [Convert]::FromBase64String($encoded)
          $ms = New-Object IO.MemoryStream(,$compressed)
          $gzip = New-Object IO.Compression.GZipStream($ms,[IO.Compression.CompressionMode]::Decompress)
          $dst = New-Object IO.MemoryStream
          try { $gzip.CopyTo($dst) } finally { $gzip.Dispose();$ms.Dispose() }
          $core = Join-Path $env:TEMP 'BBQ-ModDownloader.ps1'
          [IO.File]::WriteAllBytes($core,$dst.ToArray())
          $dst.Dispose()
          if ((Get-FileHash $core -Algorithm SHA256).Hash -ine 'c029f896eb20fb81023e32266ebda0689d2b3c96004eb9cd300b43811e7b0405') { throw 'Core SHA256 mismatch' }
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($core,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw 'Core parse error' }
          Write-Host "OK: $($all.Count) Mods, $($pins.PSObject.Properties.Count) pins; scripts parsed on Windows PowerShell."
          $launch=Get-Content (Join-Path $root 'BBQ-GitHub-Launcher-v2.ps1') -Raw
          if ($launch -match 'BBQ-Angels-Client-Patch|patchFile|ZIP-Korrektur|data-updates.lua|ZipFile') {
            throw 'Launcher must NEVER patch mod ZIP archives'
          }
          if (Test-Path (Join-Path $root 'BBQ-Angels-Client-Patch.ps1')) {
            throw 'Custom client patch script must not return'
          }
          if (Test-Path (Join-Path $root 'fixes')) {
            throw 'Custom test-mod and AMP patch directory must not return'
          }
          Write-Host "OK: Only portal originals; no custom ZIP patching; incompatible bridge mods are off."

