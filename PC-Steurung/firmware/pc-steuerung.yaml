# PC-Steuerung / ESP32 ESP-WROOM-32
# Neutraler Hostname; keine persoenlichen Namen oder Zugangsdaten.
# ACHTUNG: Hardware, Signalpegel und GPIO2-LED vor Betrieb pruefen.
# Statussignale setzen gepruefte, 3,3-V-kompatible PC817-Ausgaenge voraus.
# Der 6-s-Befehl ist KEIN sicherheitstechnischer Not-Aus.

esphome:
  name: pc-steuerung
  friendly_name: PC Steuerung
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: wlan
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "PC-Steuerung-Fallback"
    password: !secret pc_fallback_password

captive_portal:

globals:
  - id: led_ticks
    type: int
    restore_value: no
    initial_value: '0'
  - id: wlan_ticks
    type: int
    restore_value: no
    initial_value: '0'
  - id: notaus_ticks
    type: int
    restore_value: no
    initial_value: '0'
  - id: notaus_aktiv
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: power_puls_ticks
    type: int
    restore_value: no
    initial_value: '0'
  # Sechs Sekunden gefahrloser LED-Test, kein Relaisimpuls.
  - id: notaus_led_test_ticks
    type: int
    restore_value: no
    initial_value: '0'

# Relais muss 3,3-V-HIGH-Steuerung verifiziert unterstuetzen.
switch:
  - platform: gpio
    id: pc_relais
    internal: true
    pin:
      number: GPIO23
      inverted: false
    restore_mode: ALWAYS_OFF

# GPIO2-LED ist boardabhaengig; feste PWR-LED wird NICHT gesteuert.
output:
  - platform: ledc
    id: pc_status_led
    pin:
      number: GPIO2
      inverted: false
    frequency: 1220Hz

select:
  - platform: template
    name: "Onboard LED Modus"
    id: led_modus
    icon: mdi:led-on
    optimistic: true
    restore_value: true
    initial_option: "AUS"
    options:
      - "Aus Blinkend"
      - "Ein Blinkend"
      - "Aus Langsam blinken"
      - "Ein Langsam blinken"
      - "Aus Leuchtend"
      - "Ein Leuchtend"
      - "AUS"
    on_value:
      then:
        - lambda: |-
            id(led_ticks) = 0;

script:
  - id: pc_power_impuls
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !id(notaus_aktiv) &&
                     !id(pc_notaus_impuls).is_running();
          then:
            - lambda: |-
                id(power_puls_ticks) = 100;
                id(led_ticks) = 0;
            - switch.turn_on: pc_relais
            - delay: 300ms
            - switch.turn_off: pc_relais

  - id: pc_notaus_impuls
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(pc_12v_status).has_state() &&
                     id(pc_12v_status).state &&
                     !id(notaus_aktiv);
          then:
            - script.stop: pc_power_impuls
            - lambda: |-
                id(notaus_aktiv) = true;
                id(notaus_ticks) = 0;
                id(notaus_led_test_ticks) = 0;
                id(power_puls_ticks) = 0;
                // Zeigt sofort an, dass die Freigabe erfolgreich war.
                id(pc_status_led).set_level(1.0f);
                id(pc_notaus_status).publish_state(true);
            - text_sensor.template.publish:
                id: pc_notaus_rueckmeldung
                state: "Gestartet: 6 Sekunden Power-Kontakt"
            - logger.log:
                level: WARN
                format: "Erzwungenes Ausschalten gestartet"
            - switch.turn_on: pc_relais
            - delay: 6s
            - switch.turn_off: pc_relais
            - text_sensor.template.publish:
                id: pc_notaus_rueckmeldung
                state: "6 Sekunden beendet: pruefe 12V-Status"
            - if:
                condition:
                  binary_sensor.is_off: pc_12v_status
                then:
                  - lambda: |-
                      id(notaus_aktiv) = false;
                      id(notaus_ticks) = 0;
                      id(led_ticks) = 0;
                      id(pc_notaus_status).publish_state(false);
                  - text_sensor.template.publish:
                      id: pc_notaus_rueckmeldung
                      state: "Abgeschlossen: 12V AUS"
          else:
            - logger.log:
                level: WARN
                format: "6-s-Ausschalten abgelehnt: PC-Status AUS/UNBEKANNT"
            - text_sensor.template.publish:
                id: pc_notaus_rueckmeldung
                state: "Abgelehnt: 12V AUS oder Status unbekannt"

button:
  - platform: template
    name: "PC Power"
    id: pc_power_button
    icon: mdi:power
    on_press:
      - script.execute: pc_power_impuls
  - platform: template
    name: "PC Ausschalten erzwingen (6s)"
    id: pc_notaus_button
    icon: mdi:alert-octagon
    on_press:
      - script.execute: pc_notaus_impuls
  # Testet das Warnblinken sechs Sekunden lang OHNE Relais.
  # Damit laesst sich GPIO2 unabhaengig vom 12-V-Sensor pruefen.
  - platform: template
    name: "Not-Aus LED Test (ohne Relais)"
    id: pc_notaus_led_test_button
    icon: mdi:led-on
    on_press:
      - if:
          condition:
            lambda: 'return !id(notaus_aktiv);'
          then:
            - lambda: |-
                id(notaus_led_test_ticks) = 60;
                id(notaus_ticks) = 0;
                id(pc_status_led).set_level(1.0f);
            - text_sensor.template.publish:
                id: pc_notaus_rueckmeldung
                state: "LED-Test gestartet (ohne Relaisaktion)"

  - platform: restart
    name: "ESP32 Neustart"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "ESP32 Online"
    id: esp32_online
    entity_category: diagnostic

  - platform: template
    name: "Ausschalten erzwingen aktiv"
    id: pc_notaus_status
    icon: mdi:alert-octagon
    lambda: |-
      return id(notaus_aktiv);

  # Potentialfreier Schliesser zwischen GPIO18 und GND.
  - platform: gpio
    id: pc_manueller_taster
    internal: true
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: pc_power_impuls

  # Kanal 1: nur 0 bis 3,3 V am GPIO; aktiv-LOW angenommen.
  - platform: gpio
    name: "PC 12V Versorgung"
    id: pc_12v_status
    device_class: power
    pin:
      number: GPIO22
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 500ms
      - delayed_off: 2s
    on_release:
      then:
        - if:
            condition:
              lambda: |-
                return id(notaus_aktiv) &&
                       !id(pc_notaus_impuls).is_running();
            then:
              - lambda: |-
                  id(notaus_aktiv) = false;
                  id(notaus_ticks) = 0;
                  id(led_ticks) = 0;
                  id(pc_notaus_status).publish_state(false);
              - text_sensor.template.publish:
                  id: pc_notaus_rueckmeldung
                  state: "Abgeschlossen: 12V AUS"

  # Kanal 2: LED-Eingang am Mainboard NICHT direkt anschliessen,
  # bevor Mindest-Eingangsspannung des PC817-Moduls geprueft ist!
  - platform: gpio
    name: "PC Power LED"
    id: pc_power_led
    icon: mdi:led-on
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

# Alle Muster ueber 100-ms-Takt, nur GPIO2, niemals PWR-LED.
# Prioritaet: 6s-Ausschalten > WLAN-Ausfall > Power-Puls > LED-Modus
interval:
  - interval: 100ms
    then:
      - lambda: |-
          float helligkeit = 0.0f;
          const int puls_rest = id(power_puls_ticks);
          if (id(power_puls_ticks) > 0) id(power_puls_ticks)--;

          if (id(notaus_aktiv) || id(notaus_led_test_ticks) > 0) {
            // Not-Aus und separater LED-Test: 0,5 s EIN / 0,5 s AUS.
            // Beide uebersteuern WLAN und alle normalen LED-Modi.
            const int t = id(notaus_ticks);
            helligkeit = (t < 5) ? 1.0f : 0.0f;
            id(notaus_ticks) = (t + 1) % 10;
            if (id(notaus_led_test_ticks) > 0) {
              id(notaus_led_test_ticks)--;
              if (id(notaus_led_test_ticks) == 0 &&
                  !id(notaus_aktiv)) {
                id(pc_notaus_rueckmeldung).publish_state(
                    "LED-Test beendet");
              }
            }
            id(wlan_ticks) = 0;
            id(led_ticks) = 0;

          } else if (!id(wlan).is_connected()) {
            // WLAN-Verlust: 300 ms EIN, 300 ms AUS
            const int t = id(wlan_ticks);
            helligkeit = (t < 3) ? 1.0f : 0.0f;
            id(wlan_ticks) = (t + 1) % 6;
            id(notaus_ticks) = 0;
            id(led_ticks) = 0;

          } else if (puls_rest > 0) {
            // 10 Sekunden: 5 weiche PWM-Pulse je 2 Sekunden
            const int t = (100 - puls_rest) % 20;
            const float winkel = 6.2831853f * t / 20.0f;
            helligkeit = 0.08f +
                         0.92f * (1.0f - cosf(winkel)) / 2.0f;
            id(led_ticks) = 0;
            id(wlan_ticks) = 0;
            id(notaus_ticks) = 0;

          } else {
            id(wlan_ticks) = 0;
            id(notaus_ticks) = 0;
            if (id(led_modus).has_state() &&
                id(pc_12v_status).has_state()) {
              const bool pc_ein = id(pc_12v_status).state;
              const auto modus = id(led_modus).current_option();
              const int t = id(led_ticks);

              if (modus == "Aus Blinkend") {
                if (!pc_ein && (t % 20 < 10)) helligkeit = 1.0f;
              } else if (modus == "Ein Blinkend") {
                if (pc_ein && (t % 20 < 10)) helligkeit = 1.0f;
              } else if (modus == "Aus Langsam blinken") {
                if (!pc_ein && (t % 55 < 5)) helligkeit = 1.0f;
              } else if (modus == "Ein Langsam blinken") {
                if (pc_ein && (t % 55 < 5)) helligkeit = 1.0f;
              } else if (modus == "Aus Leuchtend") {
                if (!pc_ein) helligkeit = 1.0f;
              } else if (modus == "Ein Leuchtend") {
                if (pc_ein) helligkeit = 1.0f;
              }
              // AUS: 0% Helligkeit
            }
            // 220 ist durch 20 und 55 teilbar.
            id(led_ticks) = (id(led_ticks) + 1) % 220;
          }

          id(pc_status_led).set_level(helligkeit);

# Klare Rueckmeldung, ob das erzwungene Ausschalten angenommen wurde.
text_sensor:
  - platform: template
    name: "Ausschalten Rueckmeldung"
    id: pc_notaus_rueckmeldung
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: never

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    id: wifi_rssi
    update_interval: 30s
    entity_category: diagnostic
  - platform: uptime
    name: "ESP32 Laufzeit"
    id: pc_controller_uptime
    update_interval: 30s
    entity_category: diagnostic
