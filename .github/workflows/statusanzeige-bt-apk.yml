name: Build StatusAnzeige BT APK

on:
  push:
    paths:
      - "StatusAnzeige/Android_App/**"
      - ".github/workflows/statusanzeige-bt-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: StatusAnzeige/Android_App
        run: gradle :app:assembleDebug
      - name: Rename APK
        run: cp StatusAnzeige/Android_App/app/build/outputs/apk/debug/app-debug.apk StatusAnzeige-BT-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StatusAnzeige-BT-APK
          path: StatusAnzeige-BT-debug.apk
          if-no-files-found: error
